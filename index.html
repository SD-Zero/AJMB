<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masterblocks Color Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #1e1e2e;
      color: #cdd6f4;
    }
    h1 {
      text-align: center;
      color: #89b4fa;
    }
    .container {
      background: #181825;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .input-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="file"] {
      background: #313244;
      color: #cdd6f4;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      cursor: pointer;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    button:hover {
      background: #b4befe;
    }
    .preview-area {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .canvas-card {
      text-align: center;
      background: #313244;
      padding: 10px;
      border-radius: 8px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #2a2a38 25%, transparent 25%), 
                        linear-gradient(-45deg, #2a2a38 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #2a2a38 75%), 
                        linear-gradient(-45deg, transparent 75%, #2a2a38 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Masterblocks Color Converter</h1>
    
    <div class="input-group">
      <label for="imageLoader"><strong>Select Image:</strong></label>
      <input type="file" id="imageLoader" accept="image/*">
      <button id="convertBtn">Convert Colors</button>
    </div>

    <div class="preview-area">
      <div class="canvas-card">
        <h3>Original</h3>
        <canvas id="originalCanvas"></canvas>
      </div>
      <div class="canvas-card">
        <h3>Masterblocks Matched</h3>
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // PASTE YOUR ANIMAL JAM HEX CODES HERE
    // ==========================================
    const PALETTE_HEX = [
      "#FFFFFF", "#000000", "#FF0000", "#00FF00", "#0000FF",
      "#FFFF00", "#00FFFF", "#FF00FF", "#C0C0C0", "#808080",
      "#800000", "#808000", "#008000", "#800080", "#008080"
      // Add as many hex codes as you want!
    ];

    // Convert hex list to RGB arrays once on startup
    const PALETTE_RGB = PALETTE_HEX.map(hex => {
      const cleanHex = hex.replace('#', '');
      return [
        parseInt(cleanHex.substring(0, 2), 16),
        parseInt(cleanHex.substring(2, 4), 16),
        parseInt(cleanHex.substring(4, 6), 16)
      ];
    });

    const imageLoader = document.getElementById('imageLoader');
    const convertBtn = document.getElementById('convertBtn');
    const origCanvas = document.getElementById('originalCanvas');
    const outCanvas = document.getElementById('outputCanvas');
    const origCtx = origCanvas.getContext('2d');
    const outCtx = outCanvas.getContext('2d');

    let loadedImage = null;

    imageLoader.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          // Set canvas dimensions to EXACT image size
          origCanvas.width = loadedImage.width;
          origCanvas.height = loadedImage.height;
          outCanvas.width = loadedImage.width;
          outCanvas.height = loadedImage.height;

          // Draw original image
          origCtx.drawImage(loadedImage, 0, 0);
        };
        loadedImage.src = event.target.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    // Find closest color using weighted Euclidean distance (better perceptual match)
    function getClosestColor(r, g, b) {
      let minDistance = Infinity;
      let closest = PALETTE_RGB[0];

      for (let i = 0; i < PALETTE_RGB.length; i++) {
        const [pr, pg, pb] = PALETTE_RGB[i];
        
        // Red-mean formula accounts for human perception of RGB
        const rmean = (r + pr) / 2;
        const dr = r - pr;
        const dg = g - pg;
        const db = b - pb;
        
        const distance = Math.sqrt(
          (2 + rmean / 256) * dr * dr +
          4 * dg * dg +
          (2 + (255 - rmean) / 256) * db * db
        );

        if (distance < minDistance) {
          minDistance = distance;
          closest = PALETTE_RGB[i];
        }
      }
      return closest;
    }

    convertBtn.addEventListener('click', () => {
      if (!loadedImage) {
        alert("Please select an image first!");
        return;
      }

      const width = origCanvas.width;
      const height = origCanvas.height;
      const imgData = origCtx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // Loop through every pixel without changing size
      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];

        // Skip fully transparent pixels
        if (alpha < 10) continue;

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const [nr, ng, nb] = getClosestColor(r, g, b);

        data[i] = nr;
        data[i + 1] = ng;
        data[i + 2] = nb;
      }

      // Draw matched pixels to the output canvas
      outCtx.putImageData(imgData, 0, 0);
    });
  </script>
</body>
</html>
