<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Masterblocks Color Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #1e1e2e;
      color: #cdd6f4;
    }
    h1 {
      text-align: center;
      color: #89b4fa;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      color: #a6adc8;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .container {
      background: #181825;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
      background: #313244;
      padding: 15px;
      border-radius: 8px;
    }
    input[type="file"] {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #45475a;
      cursor: pointer;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    button:hover {
      background: #b4befe;
    }
    .preview-area {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }
    .canvas-card {
      text-align: center;
      background: #313244;
      padding: 15px;
      border-radius: 8px;
      flex: 1;
      min-width: 300px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #2a2a38 25%, transparent 25%), 
                        linear-gradient(-45deg, #2a2a38 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #2a2a38 75%), 
                        linear-gradient(-45deg, transparent 75%, #2a2a38 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .palette-section {
      background: #313244;
      padding: 20px;
      border-radius: 8px;
    }
    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .palette-header h3 {
      margin: 0;
      color: #89b4fa;
    }
    .palette-stats {
      font-size: 14px;
      color: #a6adc8;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(19, 1fr);
      gap: 6px;
    }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 4px;
      box-sizing: border-box;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .palette-grid.has-converted .color-swatch {
      opacity: 0.25;
      transform: scale(0.9);
    }
    .palette-grid.has-converted .color-swatch.used {
      opacity: 1;
      transform: scale(1.1);
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #89b4fa, 0 0 4px #ffffff;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Masterblocks Color Converter</h1>
    <p class="subtitle">Maps every pixel 1:1 using CIELAB perceptual color matching</p>
    
    <div class="controls">
      <input type="file" id="imageLoader" accept="image/*">
      <button id="convertBtn">Convert Image</button>
    </div>

    <div class="preview-area">
      <div class="canvas-card">
        <h3>Original Image</h3>
        <canvas id="originalCanvas"></canvas>
      </div>
      <div class="canvas-card">
        <h3>Masterblocks Matched</h3>
        <canvas id="outputCanvas"></canvas>
      </div>
    </div>

    <div class="palette-section">
      <div class="palette-header">
        <h3>Masterblocks Palette (19x11)</h3>
        <span class="palette-stats" id="paletteStats">Upload an image and convert to highlight used colors</span>
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>
  </div>

  <script>
    // Exact 209 Unique Animal Jam Masterblock Hex Codes (19x11 Grid)
    const PALETTE_HEX = [
      "#FE1027", "#FB0060", "#AA01B7", "#6E1DC1", "#4044B9", "#0094F6", "#02A7F8", "#03BDDE", "#009C87", "#0DB740",
      "#7BC733", "#C9E202", "#FBED02", "#FABD03", "#FD8B00", "#FB3700", "#E7E3E4", "#9B9697", "#527688", "#FE344D",
      "#FA4C94", "#F9DEF9", "#E8E4FA", "#E7E9FA", "#DFF1FF", "#DFF4FF", "#D7F9FB", "#E3EFED", "#E5F6EC", "#F3F6E7",
      "#F4FBE9", "#FBFDE3", "#FCDF6E", "#FEAF2F", "#FB5F2F", "#D9C4C5", "#F6F6F4", "#DFE2EC", "#F3324A", "#EB488A",
      "#E7B7E5", "#D1C0F1", "#C4C6F3", "#B4DEFD", "#A5E6FB", "#A4ECF4", "#A6E2DD", "#C2E9C8", "#DDEDBF", "#EFF8C0",
      "#F9FBB4", "#FFE170", "#DC941F", "#EF5B30", "#F25C31", "#CCBCBD", "#EFEDEC", "#C6D1D4", "#C6D1D2", "#EA3046",
      "#DE4481", "#DE83DF", "#B497DE", "#9AA2E1", "#83C8FA", "#65D7FC", "#64DEF0", "#6DCCC1", "#97D9A1", "#C0E39C",
      "#E3ED93", "#FEF592", "#FEDF6C", "#FDAE2C", "#E25528", "#5F3037", "#E9E8ED", "#A9BAC0", "#DB3041", "#D7407F",
      "#CA52CC", "#9B6DD1", "#7B7DD1", "#4FB2F5", "#0AC0FB", "#02D3E5", "#02B8AA", "#6DCA7D", "#A2DA7E", "#DFEA70",
      "#FEF161", "#FDD322", "#FDB02D", "#DA502F", "#542C33", "#DFDADE", "#87A1A6", "#CF2D3F", "#F8007D", "#B720C0",
      "#8347C8", "#5C63C5", "#0CA2FA", "#00B2FA", "#00C8E2", "#03A89E", "#43C159", "#8FCF4F", "#D3E136", "#FEF02F",
      "#FBC902", "#FEB130", "#D74D2C", "#51312E", "#B9B9BB", "#708D9A", "#FE012D", "#F60264", "#AA01B5", "#7120C0",
      "#4147BC", "#0192F5", "#03BCE2", "#01998C", "#08B640", "#CBDF03", "#F9ED02", "#FFBF01", "#FFAF30", "#FD3903",
      "#47221C", "#989C9B", "#587C8B", "#F6002A", "#EB0062", "#9702AF", "#6419B4", "#3C3FAD", "#0083E9", "#0295EC",
      "#00ADCB", "#028977", "#0FA439", "#6EB72B", "#BBCB08", "#FED801", "#FDB002", "#FEA202", "#FF3002", "#272425",
      "#73746F", "#4E7080", "#E30024", "#CE005A", "#8501A6", "#560AAA", "#2F33A8", "#0172D9", "#0282D4", "#0197A9",
      "#027B6D", "#039232", "#59A223", "#B1B801", "#FFD703", "#FC9904", "#FE6F07", "#F42402", "#1E1E1E", "#626061",
      "#415A64", "#CF021C", "#B4025B", "#75019C", "#4B03A4", "#292996", "#0061C2", "#0176C5", "#008397", "#016C5F",
      "#008425", "#448C1D", "#A0A101", "#FDA803", "#FC8606", "#FB5D00", "#E51C00", "#111111", "#314653", "#324752",
      "#C40208", "#930251", "#580092", "#35019B", "#1B1283", "#003EA9", "#0056A1", "#006167", "#004D3E", "#006314",
      "#216A09", "#877800", "#FC7400", "#FE8604", "#EF3701", "#CC1700", "#000000", "#263338", "#26333A"
    ];

    function rgbToLab(r, g, b) {
      let r_s = r / 255, g_s = g / 255, b_s = b / 255;
      r_s = (r_s > 0.04045) ? Math.pow((r_s + 0.055) / 1.055, 2.4) : r_s / 12.92;
      g_s = (g_s > 0.04045) ? Math.pow((g_s + 0.055) / 1.055, 2.4) : g_s / 12.92;
      b_s = (b_s > 0.04045) ? Math.pow((b_s + 0.055) / 1.055, 2.4) : b_s / 12.92;

      let x = (r_s * 0.4124 + g_s * 0.3576 + b_s * 0.1805) * 100;
      let y = (r_s * 0.2126 + g_s * 0.7152 + b_s * 0.0722) * 100;
      let z = (r_s * 0.0193 + g_s * 0.1192 + b_s * 0.9505) * 100;

      x /= 95.047; y /= 100.000; z /= 108.883;

      x = (x > 0.008856) ? Math.cbrt(x) : (7.787 * x) + (16 / 116);
      y = (y > 0.008856) ? Math.cbrt(y) : (7.787 * y) + (16 / 116);
      z = (z > 0.008856) ? Math.cbrt(z) : (7.787 * z) + (16 / 116);

      return [(116 * y) - 16, 500 * (x - y), 200 * (y - z)];
    }

    const PALETTE_DATA = PALETTE_HEX.map(hex => {
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16);
      const g = parseInt(cleanHex.substring(2, 4), 16);
      const b = parseInt(cleanHex.substring(4, 6), 16);
      return {
        rgb: [r, g, b],
        lab: rgbToLab(r, g, b)
      };
    });

    const imageLoader = document.getElementById('imageLoader');
    const convertBtn = document.getElementById('convertBtn');
    const origCanvas = document.getElementById('originalCanvas');
    const outCanvas = document.getElementById('outputCanvas');
    const origCtx = origCanvas.getContext('2d');
    const outCtx = outCanvas.getContext('2d');
    const paletteGrid = document.getElementById('paletteGrid');
    const paletteStats = document.getElementById('paletteStats');

    let loadedImage = null;

    PALETTE_HEX.forEach((hex, index) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch';
      swatch.style.backgroundColor = hex;
      swatch.title = hex;
      swatch.dataset.index = index;
      paletteGrid.appendChild(swatch);
    });

    imageLoader.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          origCanvas.width = loadedImage.width;
          origCanvas.height = loadedImage.height;
          outCanvas.width = loadedImage.width;
          outCanvas.height = loadedImage.height;

          origCtx.drawImage(loadedImage, 0, 0);
        };
        loadedImage.src = event.target.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function getClosestColorIndex(r, g, b) {
      const [l1, a1, b1] = rgbToLab(r, g, b);
      let minDistance = Infinity;
      let closestIndex = 0;

      for (let i = 0; i < PALETTE_DATA.length; i++) {
        const [l2, a2, b2] = PALETTE_DATA[i].lab;
        
        const distance = Math.sqrt(
          Math.pow(l1 - l2, 2) +
          Math.pow(a1 - a2, 2) +
          Math.pow(b1 - b2, 2)
        );

        if (distance < minDistance) {
          minDistance = distance;
          closestIndex = i;
        }
      }
      return closestIndex;
    }

    convertBtn.addEventListener('click', () => {
      if (!loadedImage) {
        alert("Please upload an image first!");
        return;
      }

      const width = origCanvas.width;
      const height = origCanvas.height;
      const imgData = origCtx.getImageData(0, 0, width, height);
      const data = imgData.data;

      const usedColorIndices = new Set();

      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];

        if (alpha < 10) continue;

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const matchIdx = getClosestColorIndex(r, g, b);
        const [nr, ng, nb] = PALETTE_DATA[matchIdx].rgb;

        data[i] = nr;
        data[i + 1] = ng;
        data[i + 2] = nb;

        usedColorIndices.add(matchIdx);
      }

      outCtx.putImageData(imgData, 0, 0);

      paletteGrid.classList.add('has-converted');
      const swatches = paletteGrid.querySelectorAll('.color-swatch');
      
      swatches.forEach(swatch => {
        const idx = parseInt(swatch.dataset.index);
        if (usedColorIndices.has(idx)) {
          swatch.classList.add('used');
        } else {
          swatch.classList.remove('used');
        }
      });

      paletteStats.textContent = `Colors used: ${usedColorIndices.size} / ${PALETTE_HEX.length}`;
    });
  </script>
</body>
</html>
